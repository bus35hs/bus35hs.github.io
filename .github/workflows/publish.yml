name: Pages Workflow
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Patch
        env:
          A639F1: ${{ secrets.A639F1 }}
          B838C2: ${{ secrets.B838C2 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          tag_a = os.environ.get('A639F1', '')
          tag_b = os.environ.get('B838C2', '')
          fpath = pathlib.Path('index.html')
          orig = fpath.read_text(encoding='utf-8')
          updated = orig
          if tag_a:
              updated = updated.replace('<!-- 1ad0f82168eaed1cf5e0415111e6b2a73bef -->', tag_a)
          if tag_b:
              updated = updated.replace('<!-- 89337707758fcedab22e6c30b4787a -->', tag_b)
          if updated == orig and (tag_a or tag_b):
              sys.exit(1)
          if updated != orig:
              fpath.write_text(updated, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
